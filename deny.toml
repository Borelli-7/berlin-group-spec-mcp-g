# cargo-deny policy: `cargo deny check`
[graph]
all-features = true

[advisories]
unmaintained = "all"
ignore = [
    # ttf-parser is unmaintained; it is pulled in only by pdf_oxide (fonts during PDF text
    # extraction) and has no maintained drop-in release yet. Re-evaluate on pdf_oxide upgrades.
    { id = "RUSTSEC-2026-0192", reason = "transitive via pdf_oxide; no safe upgrade available" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "zlib-acknowledgement",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
